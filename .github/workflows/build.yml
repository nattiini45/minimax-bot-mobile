name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_android:
        description: Build a signed Android artifact (requires signing secrets and relay configuration)
        type: boolean
        default: false
      relay_url:
        description: Public HTTPS relay URL (otherwise EXPO_PUBLIC_RELAY_URL repository variable)
        type: string
        required: false
      release_certificate_sha256:
        description: Expected certificate SHA-256 (otherwise EXPECTED_RELEASE_CERT_SHA256 variable/secret)
        type: string
        required: false

permissions:
  contents: read

jobs:
  test:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          # Cache discovery invokes npm inside the checkout before the pinned bootstrap.
          package-manager-cache: false

      # Project-scoped tooling outside the checkout: no global npm replacement.
      - name: install the declared npm
        working-directory: ${{ runner.temp }}
        run: |
          npm install --prefix "$RUNNER_TEMP/project-npm" --ignore-scripts --no-audit --no-fund npm@12.2.1
          echo "$RUNNER_TEMP/project-npm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: verify package manager and restore locked dependencies
        run: |
          test "$(npm --version)" = 12.2.1
          npm ci

      - name: dependency advisory policy
        run: npm run audit:dependencies

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      - name: build and CI policy regressions
        run: npm run test:policy

      - name: bridge tests
        run: npm run test:bridge

      - name: unit tests
        run: npm run test:unit -- packages/protocol packages/relay scripts/test/network-security-config.test.ts

      - name: app tests
        run: npm run test:app -- --runInBand

      - name: web export
        env:
          # Optional: unconfigured forks can validate/export without a live relay.
          EXPO_PUBLIC_RELAY_URL: ${{ inputs.relay_url || vars.EXPO_PUBLIC_RELAY_URL }}
        run: npm run export:web

  android:
    name: signed Android artifact (explicit opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.signed_android == true
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: validate signing settings
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          EXPO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EXPO_ANDROID_KEYSTORE_PASSWORD }}
          EXPO_ANDROID_KEY_ALIAS: ${{ secrets.EXPO_ANDROID_KEY_ALIAS }}
          EXPO_ANDROID_KEY_PASSWORD: ${{ secrets.EXPO_ANDROID_KEY_PASSWORD }}
          EXPECTED_RELEASE_CERT_SHA256: ${{ inputs.release_certificate_sha256 || vars.EXPECTED_RELEASE_CERT_SHA256 || secrets.EXPECTED_RELEASE_CERT_SHA256 }}
          EXPO_PUBLIC_RELAY_URL: ${{ inputs.relay_url || vars.EXPO_PUBLIC_RELAY_URL }}
        run: |
          set +x
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 EXPO_ANDROID_KEYSTORE_PASSWORD EXPO_ANDROID_KEY_ALIAS EXPO_ANDROID_KEY_PASSWORD EXPECTED_RELEASE_CERT_SHA256 EXPO_PUBLIC_RELAY_URL; do
            if [ -z "${!name}" ]; then
              echo "Explicit signed Android build requires $name." >&2
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: install the declared npm
        working-directory: ${{ runner.temp }}
        run: |
          npm install --prefix "$RUNNER_TEMP/project-npm" --ignore-scripts --no-audit --no-fund npm@12.2.1
          echo "$RUNNER_TEMP/project-npm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: verify package manager
        run: test "$(npm --version)" = 12.2.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          overwrite-settings: false

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "cmdline-tools;latest platform-tools"
          log-accepted-android-sdk-licenses: false

      - name: restore the release key outside source and staging
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/keys/release.keystore"

      - name: build the signed artifact
        env:
          EXPO_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keys/release.keystore
          EXPO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EXPO_ANDROID_KEYSTORE_PASSWORD }}
          EXPO_ANDROID_KEY_ALIAS: ${{ secrets.EXPO_ANDROID_KEY_ALIAS }}
          EXPO_ANDROID_KEY_PASSWORD: ${{ secrets.EXPO_ANDROID_KEY_PASSWORD }}
          EXPECTED_RELEASE_CERT_SHA256: ${{ inputs.release_certificate_sha256 || vars.EXPECTED_RELEASE_CERT_SHA256 || secrets.EXPECTED_RELEASE_CERT_SHA256 }}
          EXPO_PUBLIC_RELAY_URL: ${{ inputs.relay_url || vars.EXPO_PUBLIC_RELAY_URL }}
        run: bash scripts/build-android.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/android-build" "$RUNNER_TEMP/android-artifacts"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-apk
          path: ${{ runner.temp }}/android-artifacts/minimax-bot-mobile-release.apk
          if-no-files-found: error
