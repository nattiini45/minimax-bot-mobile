name: build

# The repository had no CI at all. This runs the suites on every change, and
# builds the signed Android release on the branch that ships it.
#
# The release key is the operator's and never lives in the repository: it is
# restored from a secret, and the build checks that the artefact carries the
# expected certificate before it is allowed to pass.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which is what honours the `allowScripts` list in
          # the root package.json. npm 10 does not know the field and would run
          # every install script, which is the opposite of what that list is for.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

  android:
    name: android release
    # The release key is a secret, and secrets are not available to a pull
    # request from a fork. The release build therefore runs on the branch that
    # ships it, and on demand — not on every pull request.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # The action's default package list asks for `tools`, which the SDK
          # repository no longer has - the command line tools are
          # `cmdline-tools` now, and asking for the old name fails the step
          # before any of this repository's code runs.
          packages: 'cmdline-tools;latest' 'platform-tools'

      - name: restore the release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set, so there is no release key" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/keys/release.keystore"

      - name: build the signed release
        env:
          EXPO_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keys/release.keystore
          EXPO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EXPO_ANDROID_KEYSTORE_PASSWORD }}
          EXPO_ANDROID_KEY_ALIAS: ${{ secrets.EXPO_ANDROID_KEY_ALIAS }}
          EXPO_ANDROID_KEY_PASSWORD: ${{ secrets.EXPO_ANDROID_KEY_PASSWORD }}
          EXPECTED_RELEASE_CERT_SHA256: ${{ vars.EXPECTED_RELEASE_CERT_SHA256 || secrets.EXPECTED_RELEASE_CERT_SHA256 }}
        # The build fails when the release key is missing and when the artefact it
        # produced is not signed with the expected certificate.
        run: scripts/build-android.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/src"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: ${{ runner.temp }}/src/apps/app/android/app/build/outputs/**/*.apk
          if-no-files-found: error
